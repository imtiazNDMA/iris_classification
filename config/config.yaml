# Data Configuration
data:
  features_path: "data/features.csv"
  targets_path: "data/targets.csv"
  test_size: 0.3
  random_state: 42
  stratify: true

# Model Configuration
models:
  logistic_regression:
    penalty: "l2"
    C: 1.0
    solver: "lbfgs"
    max_iter: 1000
    random_state: 42
  
  decision_tree:
    criterion: "gini"
    max_depth: null
    min_samples_split: 2
    min_samples_leaf: 1
    random_state: 42
  
  random_forest:
    n_estimators: 100
    criterion: "gini"
    max_depth: null
    min_samples_split: 2
    min_samples_leaf: 1
    random_state: 42
  
  svm:
    C: 1.0
    kernel: "rbf"
    gamma: "scale"
    probability: true

# Hyperparameter Grids for Tuning
hyperparameter_grids:
  logistic_regression:
    penalty: ["l2"]
    C: [0.1, 1.0, 10.0, 100.0]
    solver: ["lbfgs"]
    max_iter: [1000, 2000]
  
  decision_tree:
    criterion: ["gini", "entropy"]
    max_depth: [3, 5, 7, null]
    min_samples_split: [2, 5, 10]
    min_samples_leaf: [1, 2, 4]
  
  random_forest:
    n_estimators: [50, 100, 200]
    criterion: ["gini", "entropy"]
    max_depth: [3, 5, 7, null]
    min_samples_split: [2, 5, 10]
  
  svm:
    C: [0.1, 1.0, 10.0, 100.0]
    kernel: ["linear", "rbf", "poly"]
    gamma: ["scale", "auto"]

# Cross-Validation Configuration
cross_validation:
  cv_folds: 5
  scoring: "accuracy"
  n_jobs: -1
  verbose: 1

# Output Configuration
output:
  results_dir: "results"
  model_results_path: "results/MODEL RESULTS/ml_pipeline_results.pkl"
  save_models: true
  save_predictions: true

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/ml_pipeline.log"
  console: true

# Visualization Configuration
visualization:
  figure_size: [12, 8]
  dpi: 300
  style: "seaborn-v0_8"
  color_palette: "coolwarm"
  save_format: "png"